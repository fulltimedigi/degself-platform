name: refresh web-v2 lockfile

on:
  push:
    branches:
      - agent/network-workshop-profile-editor
    paths:
      - .github/workflows/refresh-web-v2-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/network-workshop-profile-editor
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Refresh vulnerable transitive dependency
        working-directory: apps/web-v2
        run: npm audit fix --package-lock-only --omit=dev
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- apps/web-v2/package-lock.json; then
            echo "No lockfile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-v2/package-lock.json
          git commit -m "fix: refresh vulnerable transitive dependency"
          git push origin HEAD:agent/network-workshop-profile-editor
