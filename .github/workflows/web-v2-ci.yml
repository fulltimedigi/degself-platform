name: web-v2 CI

on:
  push:
    branches: [master]
    paths:
      - "apps/web-v2/**"
      - ".github/workflows/web-v2-ci.yml"
  pull_request:
    paths:
      - "apps/web-v2/**"
      - ".github/workflows/web-v2-ci.yml"

concurrency:
  group: web-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Full `next build` needs live Supabase for ISR page data — validated on Vercel.
