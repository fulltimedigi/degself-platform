name: web-v2 CI

on:
  push:
    branches: [master]
    paths:
      - "apps/web-v2/**"
      - ".github/workflows/web-v2-ci.yml"
  pull_request:
    paths:
      - "apps/web-v2/**"
      - ".github/workflows/web-v2-ci.yml"

concurrency:
  group: web-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-v2
    env:
      # These are public browser credentials, not secrets. Build-time pages read
      # the same public catalog used by production; writes remain protected by RLS.
      NEXT_PUBLIC_SITE_URL: https://degself.com
      NEXT_PUBLIC_SUPABASE_URL: https://xqmwhrimxnvqlpvfzcac.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LoNhEb3DLP5TkgEjZKkSJQ_Q9MKtqhd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep CI identical to the Vercel production project runtime.
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
