name: web-v2 CI

on:
  push:
    branches: [master]
    paths:
      - "apps/web-v2/**"
      - ".github/workflows/web-v2-ci.yml"
  pull_request:
    paths:
      - "apps/web-v2/**"
      - ".github/workflows/web-v2-ci.yml"

concurrency:
  group: web-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-v2
    env:
      # Secretless compile/build placeholders (no real backend calls during build).
      NEXT_PUBLIC_SITE_URL: https://degself.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
