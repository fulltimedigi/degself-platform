name: web-v2 CI

on:
  push:
    branches: [master]
    paths:
      - "apps/web-v2/**"
      - ".github/workflows/web-v2-ci.yml"
  pull_request:
    paths:
      - "apps/web-v2/**"
      - ".github/workflows/web-v2-ci.yml"

permissions:
  contents: write

concurrency:
  group: web-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-v2
    env:
      # These are public browser credentials, not secrets. Build-time pages read
      # the same public catalog used by production; writes remain protected by RLS.
      NEXT_PUBLIC_SITE_URL: https://degself.com
      NEXT_PUBLIC_SUPABASE_URL: https://xqmwhrimxnvqlpvfzcac.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LoNhEb3DLP5TkgEjZKkSJQ_Q9MKtqhd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          # Keep CI identical to the Vercel production project runtime.
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Refresh secure dependency lock
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/p1-release-hardening'
        run: npm install next@16.3.0 --save-exact --package-lock-only --ignore-scripts
      - name: Commit generated dependency lock
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/p1-release-hardening'
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-v2/package.json apps/web-v2/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh secure dependency lock"
            git push origin HEAD:agent/p1-release-hardening
          fi
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Critical route smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/degself-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/degself-next.log' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          for path in / /about /login /quote/new /isal-degself /admin/login '/search?q=%D9%82%D9%8A%D8%B1'; do
            echo "smoke: $path"
            curl --silent --show-error --fail --max-time 20 "http://127.0.0.1:3000${path}" > /dev/null
          done
